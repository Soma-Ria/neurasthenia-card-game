<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>神经衰弱 · 联机 V4.1</title><link rel="stylesheet" href="/style.css"></head>
<body>
<header><div><h1>🃏 神经衰弱</h1><small id="status">未连接</small></div><button id="rulesBtn">游戏规则</button></header>
<main>
<section id="home" class="panel">
<h2>开始游戏</h2>
<button id="createBtn" class="primary">创建房间</button>
<div class="join"><input id="roomInput" maxlength="8" placeholder="输入房间号"><button id="joinBtn">加入房间</button></div>
<div class="rules" id="homeRules"></div>
</section>

<section id="room" class="panel hidden">
<div class="roomHead"><div>房间号 <b id="roomCode"></b></div><button id="copyBtn">复制邀请链接</button></div>
<div id="players" class="players"></div>

<section id="setup">
<h2>准备阶段</h2>
<div class="settings">
<label>游戏规则<select id="rule"><option value="normal">普通规则</option><option value="special">角色规则</option></select></label>
<label>鬼牌<select id="joker"><option value="off">关闭</option><option value="on">开启</option></select></label>
<label>鬼牌方向<select id="direction"><option value="cw">顺时针</option><option value="ccw">逆时针</option></select></label>
</div>

<div class="box"><h3>我的信息</h3>
<div class="myInfo"><label>名字<input id="nameInput" maxlength="20"></label><button id="saveName">保存名字</button></div>
<h4>我的颜色</h4><div id="colors" class="colors"></div></div>

<div id="editor" class="box">
<div class="editorHead"><h3>卡牌配置</h3><button id="addCard">＋ 添加卡牌</button></div>
<div class="cardHeader"><span>名称</span><span>所属角色</span><span>数量</span><span></span></div>
<div id="cardRows"></div>
<small>所属角色使用下拉栏选择；“普通卡”不属于任何玩家。数量表示该卡牌出现的张数。</small>
</div>

<div class="actions"><button id="readyBtn" class="primary">准备</button><button id="startBtn" class="primary host">开始游戏</button></div>
<div class="rules" id="setupRules"></div>
</section>

<section id="game" class="hidden">
<div class="gameHead"><strong>当前回合：<span id="turn"></span></strong><button id="endBtn" class="danger host">结束本局</button></div>
<div id="scores" class="scores"></div><div id="board" class="board"></div>
</section>

<section id="finished" class="hidden"><h2>本局结束</h2><div id="result"></div><button id="backLobby" class="host primary">返回准备阶段</button></section>
</section>
</main>

<div id="modal" class="modal hidden"><div class="modalCard"><button id="closeModal">×</button><div id="modalText"></div></div></div>
<script src="/game.js"></script>
</body></html>
