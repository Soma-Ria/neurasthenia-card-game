<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>神经衰弱 · 联机 V5.7.2</title><link rel="stylesheet" href="/style.css"></head><body>
<header><div><h1>🃏 神经衰弱</h1><small id="status">未连接</small></div><button id="rulesBtn">📖 游戏规则</button></header><main>
<section id="home" class="panel"><h2>开始游戏</h2><button id="createBtn" class="primary">创建房间</button><div class="join"><input id="roomInput" maxlength="8" placeholder="输入房间号"><button id="joinBtn">加入房间</button></div><div class="rules" id="homeRules"></div></section>
<section id="room" class="panel hidden"><div class="roomHead"><div>房间号 <b id="roomCode"></b></div><div class="roomButtons"><button id="copyBtn">复制邀请链接</button><button id="leaveBtn">退出房间</button></div></div><div id="players" class="players"></div>
<section id="setup"><h2>准备阶段</h2><div class="settings"><label>游戏规则<select id="rule"><option value="normal">普通规则</option><option value="special">角色规则</option></select></label><label>鬼牌<select id="joker"><option value="off">关闭</option><option value="on">开启</option></select></label><label>鬼牌数量<select id="jokerCount"><option>1</option><option>2</option><option>3</option><option>4</option></select></label><label>鬼牌方向<select id="direction"><option value="cw">顺时针</option><option value="ccw">逆时针</option><option value="random">随机</option></select></label><label>失败牌展示<select id="failTime"><option value="1">1 秒</option><option value="2">2 秒</option><option value="3">3 秒</option><option value="5">5 秒</option><option value="10">10 秒</option></select></label><label>惩罚牌<select id="penaltyEnabled"><option value="off">关闭</option><option value="on">开启</option></select></label></div>
<div class="box"><h3>我的信息</h3><div class="myInfo"><label>名字<input id="nameInput" maxlength="20"></label><button id="saveName">保存名字</button></div><h4>我的颜色</h4><div id="colors" class="colors"></div></div>
<div id="permBox" class="box host"><h3>公共区卡牌权限</h3><p class="muted">房主可以逐人决定：是否能查看/修改公共区卡牌，以及是否进入观战区。房主自己也可以设置为观战。</p><div id="permRows"></div></div>
<div id="editor" class="box"><div class="editorHead"><h3 id="editorTitle">公共区卡牌</h3><div><button id="batchAdd">＋ 批量添加</button><button id="addCard">＋ 添加一张</button></div></div><div class="batch hidden" id="batchBox"><label>一次添加 <input id="batchCount" type="number" min="1" max="100" value="10"> 张</label><button id="batchConfirm">添加</button><button id="batchCancel">取消</button></div><div class="cardHeader"><span>名称</span><span>所属角色</span><span>数量</span><span></span></div><div id="cardRows"></div></div>
<div id="penaltySettings" class="box hidden"><div class="editorHead"><h3>惩罚牌设置</h3><span class="muted">仅在上方选择“开启”后显示</span></div><label>设置权限<select id="penaltyMode"><option value="host">仅房主设置</option><option value="shared">指定人员/所有人共同设置</option><option value="personal">每个人设置自己的惩罚牌</option></select></label><div id="penaltyPerms"></div><div class="editorHead"><h4>惩罚牌列表</h4><button id="addPenalty">＋ 添加惩罚牌</button></div><div class="cardHeader penaltyHeader"><span>名称</span><span>归属角色/玩家</span><span>数量</span><span>隐藏</span></div><div id="penaltyRows"></div></div>
<div class="actions"><button id="readyBtn" class="readyBtn">○ 尚未准备</button><button id="startBtn" class="primary host">开始游戏</button></div><div class="rules" id="setupRules"></div></section>
<section id="game" class="hidden"><div class="turnBanner" id="turnBanner"></div><div class="gameHead"><strong>当前回合：<span id="turn"></span></strong><button id="endBtn" class="danger host">结束本局</button></div><div id="scores" class="scores"></div><div class="owned" id="owned"></div><div class="eventColumns"><div><h3>鬼牌提示</h3><div id="jokerEvents" class="events"></div></div><div><h3>角色牌提示</h3><div id="roleEvents" class="events"></div></div></div><h3>公共区</h3><div id="board" class="board"></div></section>
<section id="ending" class="hidden"><div class="endingCard"><div class="endingIcon">🏁</div><h2>本局结束</h2><p>正在整理本局结果…</p><div class="endingTimer">结算即将开始</div></div></section><section id="finished" class="hidden"><h2>结算结果</h2><div id="result"></div><button id="backLobby" class="host primary">返回准备阶段</button></section></section></main>
<div id="modal" class="modal hidden"><div class="modalCard"><button id="closeModal">×</button><div id="modalText"></div></div></div><div id="toast" class="toast hidden"></div><script src="/game.js"></script></body></html>
