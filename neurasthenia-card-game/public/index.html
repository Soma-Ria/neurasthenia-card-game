<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>神经衰弱 · 联机版</title><link rel="stylesheet" href="/style.css"></head><body><main class="app"><header><div><h1>🃏 神经衰弱</h1><p>1～6人 · Cloudflare 联机版 V3</p></div><span id="conn" class="badge">未连接</span></header><section id="lobby" class="panel"><div id="home"><h2>在线游戏</h2><label>你的名字</label><input id="homeName" maxlength="20" value="玩家1"><div class="homeBtns"><button id="create" class="primary">创建房间</button><div class="join"><input id="roomInput" maxlength="6" placeholder="房间号"><button id="join">加入房间</button></div></div></div><div id="room" class="hidden"><div class="roomHead"><div><h2>房间 <b id="roomId"></b></h2><p>把下面链接发给朋友即可加入</p><input id="share" readonly></div><button id="copy">复制邀请链接</button></div><div id="players" class="players"></div><div id="hostSettings" class="settings hidden"><h3>游戏设置（房主）</h3><div class="two"><label>规则<select id="mode"><option value="normal">普通规则</option><option value="special">角色卡牌规则</option></select></label><label>鬼牌<select id="ghost"><option value="off">关闭</option><option value="on">开启</option></select></label><label>鬼牌数量<input id="ghostCount" type="number" min="1" value="1"></label><label>方向<select id="direction"><option value="cw">顺时针</option><option value="ccw">逆时针</option></select></label></div><p>卡牌组格式：名称 / 数量 / 类型 / 所属玩家。每组用一行表示。</p><textarea id="groups" rows="7"></textarea><small>示例：猫咪|2|normal|-1<br>角色A|2|player|0<br>角色B|2|player|1</small></div><div class="roomBtns"><button id="ready">准备</button><button id="start" class="primary hidden">开始游戏</button><button id="leave">离开</button></div></div></section><section id="game" class="panel hidden"><div class="gameTop"><div><b id="turn"></b><small id="remain"></small></div><div id="scores"></div></div><div id="board" class="board"></div><div id="message" class="message"></div></section></main><div id="toast"></div><script src="/game.js"></script></body></html>
